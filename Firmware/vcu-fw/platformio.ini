; Spartan Velocity VCU firmware
;
; env:teensy41  builds for the board
; env:native    runs the derate unit tests on this machine, no hardware needed
;
; Notes:  obsidian://open?vault=vault-mm&file=10-Projects%2FSpartan-Velocity%2FSubsystems%2FVCU

[platformio]
default_envs = teensy41

[env:teensy41]
platform    = teensy
board       = teensy41
framework   = arduino
build_flags = -Wall -Wextra

[env:native]
platform       = native
test_framework = unity
; Link the project sources into the test binary, but only the pure control
; law -- main.cpp needs Arduino and cannot build on the host.
test_build_src   = yes
build_src_filter = +<derate.c>
build_flags      = -Wall -Wextra -Iinclude
; expf() lives in libm on the host, and the library has to land after the
; objects on the link line, which build_flags cannot guarantee.
extra_scripts    = pre:native_libm.py
